events {}

http {
  # OpenSubsonic authentication is carried in query parameters. Keep access
  # logs useful without ever recording salts, tokens, invitation data, or
  # arbitrary query strings.
  log_format music_room_safe '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log music_room_safe;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 4533 default_server;
    server_name _;
    client_max_body_size 64m;

    location = /music-room {
      return 308 /music-room/admin/;
    }

    location = /music-room/admin {
      return 308 /music-room/admin/;
    }

    location /music-room/ {
      proxy_pass http://music-room-gateway:4534/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      # The gateway trusts this private edge. Do not pass a client-supplied
      # X-Forwarded-For value through to authentication rate limiting.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://navidrome:4533;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }
  }
}
