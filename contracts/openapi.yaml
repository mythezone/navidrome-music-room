      - serverTime
      - payload
      properties:
        type:
          type: string
          enum:
          - snapshot
          - playback
          - queue
          - history
          - presence
          - room_updated
          - chat_message
          - chat_updated
          - wish_updated
          - wish_deleted
          - update_available
          - pong
          - error
        roomID:
          $ref: '#/components/schemas/Identifier'
        serverTime:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 0
        payload:
          anyOf:
          - $ref: '#/components/schemas/Snapshot'
          - $ref: '#/components/schemas/Playback'
          - $ref: '#/components/schemas/ChatMessage'
          - $ref: '#/components/schemas/Wish'
          - $ref: '#/components/schemas/UpdateNotice'
          - type: array
            items: {}
          - type: object
            description: Presence, room, deletion, pong, or error payload.
    PluginSync:
      type: object
      required: [pluginVersion, generation, navidromeInternalURL, users]
      properties:
        pluginVersion: { type: string, minLength: 1 }
        generation: { type: integer, minimum: 1 }
        navidromeInternalURL: { type: string, format: uri }
        navidromePublicURL: { type: string, format: uri }
        gatewayPublicURL: { type: string, format: uri }
        updateChannel: { type: string, enum: [stable, beta], default: stable }
        sentAt: { type: string, format: date-time }
        users:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [username, displayName, admin]
            properties:
              username: { type: string, minLength: 1, maxLength: 128 }
              displayName: { type: string }
              admin: { type: boolean }
