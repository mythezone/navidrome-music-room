      type: object
      required: [acceptedGeneration, leaseExpiresAt, gatewayVersion, updateAvailable, latestVersion, releaseURL]
      properties:
        acceptedGeneration: { type: integer }
        leaseExpiresAt: { type: string, format: date-time }
        gatewayVersion: { type: string }
        updateAvailable: { type: boolean }
        latestVersion: { type: string }
        releaseURL: { type: string }
