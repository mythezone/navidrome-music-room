openapi: 3.1.0
info:
  title: Navidrome Music Room Gateway API
  version: 1.2.0
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  description: |
    Versioned room coordination API for MusicMate. Media bytes never pass through this API;
    clients stream audio, artwork, and lyrics directly from Navidrome with their own credentials.
servers:
  - url: https://music.example.test/music-room/api/v1
security:
  - roomSession: []
tags:
  - name: Auth
    description: Navidrome authentication and gateway discovery.
  - name: Rooms
    description: Room settings, membership, presence, and snapshots.
  - name: Invitations
    description: Persistent room membership through revocable invitations.
  - name: Playback
    description: Synchronized playback, queue management, and history.
  - name: Capabilities
    description: Features available in this release.
  - name: Updates
    description: Administrative diagnostics and signed releases.
  - name: Community
    description: Room chat, stickers, statistics, achievements, and song wishes.
paths:
  /discovery:
    get:
      operationId: getDiscovery
      tags: [Auth]
      summary: Resolve the Navidrome public URL for an HTTPS invitation link
      security: []
      responses:
        '200':
          description: Public, non-secret gateway connection metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discovery' }
  /auth/exchange:
    post:
      operationId: postAuthExchange
      tags: [Auth]
      summary: Exchange an OpenSubsonic salt/token proof for a 15-minute room session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthProof'
      responses:
        '200':
          description: Authenticated room session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthExchange'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/session:
    delete:
      operationId: deleteAuthSession
      tags: [Auth]
      summary: Revoke the current in-memory room session
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
  /rooms:
    get:
      operationId: getRooms
      tags: [Rooms]
      summary: List rooms visible to the current user
      responses:
        '200':
          description: Rooms where the user is a member; administrators see all rooms
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items: { $ref: '#/components/schemas/Room' }
    post:
      operationId: postRooms
      tags: [Rooms]
      summary: Create a room
      description: Requires both Navidrome adminRole and plugin authorization.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}:
    parameters:
      - $ref: '#/components/parameters/RoomID'
    get:
      operationId: getRoomsRoomId
      tags: [Rooms]
      summary: Read one room
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: patchRoomsRoomId
      tags: [Rooms]
      summary: Update a room as owner or administrator
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomPatch' }
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteRoomsRoomId
      tags: [Rooms]
      summary: Permanently delete a room as owner or administrator
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Room deleted }
        '403': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/close:
    post:
      operationId: postRoomsRoomIdClose
      tags: [Rooms]
      summary: Close a room to new joins and queue changes
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/reopen:
    post:
      operationId: postRoomsRoomIdReopen
      tags: [Rooms]
      summary: Reopen a room when the plugin lease is healthy
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reopened room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '503': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/invites:
    parameters: [{ $ref: '#/components/parameters/RoomID' }]
    get:
      operationId: getRoomsRoomIdInvites
      tags: [Invitations]
      summary: List invitation metadata without secrets
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
    post:
      operationId: postRoomsRoomIdInvites
      tags: [Invitations]
      summary: Create a revocable invitation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
                expiresAt: { type: string, format: date-time }
                maxUses: { type: integer, minimum: 1, maximum: 10000, default: 20 }
                singleUse: { type: boolean, default: false }
      responses:
        '201':
          description: Secret is returned once; only its SHA-256 digest is persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteWithSecret' }
  /rooms/{room_id}/invites/{invite_id}:
    delete:
      operationId: deleteRoomsRoomIdInvitesInviteId
      tags: [Invitations]
      summary: Revoke an invitation without removing existing members
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - name: invite_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Invitation revoked }
        '404': { $ref: '#/components/responses/Error' }
  /invites/redeem:
    post:
      operationId: postInvitesRedeem
      tags: [Invitations]
      summary: Redeem an invitation into persistent room membership
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomID, invite]
              properties:
                roomID: { $ref: '#/components/schemas/Identifier' }
                invite: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Membership created or already active
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
                  room: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/members:
    get:
      operationId: getRoomsRoomIdMembers
      tags: [Rooms]
      summary: List persistent members with current presence
      parameters: [{ $ref: '#/components/parameters/RoomID' }]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
  /rooms/{room_id}/members/{username}:
    delete:
      operationId: deleteRoomsRoomIdMembersUsername
      tags: [Rooms]
      summary: Remove a member and disconnect their room WebSockets
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - name: username
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Member removed }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/join:
    post:
      operationId: postRoomsRoomIdJoin
      tags: [Rooms]
      summary: Enter a room after membership and library checks
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Joined }
        '403': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/leave:
    post:
      operationId: postRoomsRoomIdLeave
      tags: [Rooms]
      summary: Deactivate the current membership
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Left room }
        '409': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/snapshot:
    get:
      operationId: getRoomsRoomIdSnapshot
      tags: [Rooms]
      summary: Read the authoritative room snapshot
      parameters: [{ $ref: '#/components/parameters/RoomID' }]
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
  /rooms/{room_id}/history:
    get:
      operationId: getRoomsRoomIdHistory
      tags: [Playback]
      summary: Read playback history
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: History page }
  /rooms/{room_id}/playback:
    post:
      operationId: postRoomsRoomIdPlayback
      tags: [Playback]
      summary: Change authoritative playback
      description: Play, pause, seek, previous, and stop require a manager. Next also allows members when allowMemberSkip is true or they contributed the current track; otherwise returns skip_permission_required (403). Previous resets the current track above five seconds, otherwise loads the last finished history entry and returns the current track to the queue front.
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command, expectedRevision]
              properties:
                command: { type: string, enum: [play, pause, seek, next, previous, stop] }
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                positionSeconds: { type: number, minimum: 0 }
      responses:
        '200':
          description: New playback state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playback' }
        '403':
          description: skip_permission_required for a disallowed next; room_manager_required for other controls.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Includes `details.latest` when code is `revision_conflict`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /rooms/{room_id}/queue/tracks:
    post:
      operationId: postRoomsRoomIdQueueTracks
      tags: [Playback]
      summary: Add an accessible Navidrome track to the member's pending queue
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track]
              properties:
                playNext: { type: boolean, default: false, description: Insert at position 1; requires a room manager. }
                track: { $ref: '#/components/schemas/TrackRef' }
      responses:
        '201':
          description: Queue entry accepted; `playback` is present when the first pending track became the paused current track
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueMutation' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/queue/{queue_id}:
    delete:
      operationId: deleteRoomsRoomIdQueueQueueId
      tags: [Playback]
      summary: Remove one's own pending entry, or any entry as a manager
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - name: queue_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Queue entry removed }
        '403': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/queue/order:
    put:
      operationId: putRoomsRoomIdQueueOrder
      tags: [Playback]
      summary: Reorder the complete queue as a manager
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queueIDs]
              properties:
                queueIDs:
                  type: array
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200': { description: Reordered queue }
        '409': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/ws-ticket:
    post:
      operationId: postRoomsRoomIdWsTicket
      tags: [Rooms]
      summary: Create a one-use WebSocket ticket valid for 60 seconds
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Ticket and WebSocket URL
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt, webSocketURL]
                properties:
                  ticket: { type: string }
                  expiresAt: { type: string, format: date-time }
                  webSocketURL: { type: string, format: uri }
  /rooms/{room_id}/ws:
    get:
      operationId: getRoomsRoomIdWs
      x-websocket-message: { $ref: '#/components/schemas/Event' }
      tags: [Rooms]
      summary: Upgrade to the room WebSocket
      description: |
        The `ticket` query value is one-use and expires after 60 seconds. Server events are
        `snapshot`, `playback`, `queue`, `history`, `presence`, `room_updated`, `chat_message`, `chat_updated`, `wish_updated`, `wish_deleted`,
        `update_available` (Navidrome admins only), and `error`. Payloads follow the Event schema.
        Chat and wish changes contain their full objects; wish_deleted contains wishID.
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomID'
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        '101': { description: WebSocket upgraded }
        '401': { $ref: '#/components/responses/Error' }
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [Capabilities]
      summary: Return the current open-source feature availability
      responses:
        '200':
          description: Project metadata and the capabilities implemented by this release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureAvailability' }
  /admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      tags: [Updates]
      summary: Explicitly export an automatically redacted diagnostic bundle
      description: Returns aggregate runtime, plugin heartbeat, update, and database health only; no URLs, names, room identifiers, invitations, credentials, or row data are included.
      responses:
        '200':
          description: Private JSON attachment generated on demand
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticBundle' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/updates:
    get:
      operationId: getAdminUpdates
      tags: [Updates]
      summary: Read local updater state as a Navidrome administrator
      responses:
        '200':
          description: Update state
          content:
            application/json:
              schema:
                type: object
                required: [status, repository, managedByLauncher, actions, pluginVersion, pluginPaired, versionMismatch]
                properties:
                  status: { $ref: '#/components/schemas/UpdateStatus' }
                  pluginVersion: { type: string }
                  pluginPaired: { type: boolean }
                  versionMismatch: { type: boolean }
                  repository: { type: string }
                  managedByLauncher: { type: boolean }
                  actions: { type: array, items: { type: string, enum: [check, stage, install, rollback] } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: postAdminUpdates
      tags: [Updates]
      summary: Check, stage, install, or roll back a signed GitHub release
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [check, stage, install, rollback] }
                version: { type: string }
      responses:
        '200': { description: Check completed }
        '202': { description: 'Stage, activation, or rollback accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /rooms/{room_id}/queue/shuffle:
    post:
      operationId: postRoomsRoomIdQueueShuffle
      tags:
      - Playback
      summary: Shuffle the pending queue as a manager
      parameters:
      - $ref: '#/components/parameters/RoomID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Shuffle the pending queue as a manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      description: Keep queue[0] fixed; shuffle queue[1:] only when at least three entries remain.
  /rooms/{room_id}/queue/{queue_id}/top:
    post:
      operationId: postRoomsRoomIdQueueQueueIdTop
      tags:
      - Playback
      summary: Move a pending entry to position 1 as a manager
      parameters:
      - $ref: '#/components/parameters/RoomID'
      - name: queue_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Move a pending entry to position 1 as a manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /rooms/{room_id}/history/{history_id}/requeue:
    post:
      operationId: postRoomsRoomIdHistoryHistoryIdRequeue
      tags:
      - Playback
      summary: Request a history track again as an active member
      parameters:
      - $ref: '#/components/parameters/RoomID'
      - name: history_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Request a history track again as an active member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMutation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      description: Requires an open room and current Navidrome library access. Track metadata is revalidated; increments
        requestedCount and primes idle playback.
  /rooms/{room_id}/chat:
    get:
      operationId: getRoomsRoomIdChat
      tags:
      - Community
      summary: Read a chronological page of room messages
      parameters:
      - $ref: '#/components/parameters/RoomID'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Read a chronological page of room messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      description: Messages are oldest to newest within the page. Pass nextBefore to load older messages. Recalled
        and deleted messages remain as empty tombstones, including in reply previews.
    post:
      operationId: postRoomsRoomIdChat
      tags:
      - Community
      summary: Send a chat message or review
      parameters:
      - $ref: '#/components/parameters/RoomID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Send a chat message or review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreate'
      description: Limited to 20 messages per minute per user across rooms (chat_rate_limited). Broadcasts chat_message.
  /rooms/{room_id}/chat/{message_id}/recall:
    post:
      operationId: postRoomsRoomIdChatMessageIdRecall
      tags:
      - Community
      summary: Recall your own message within five minutes
      parameters:
      - $ref: '#/components/parameters/RoomID'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Recall your own message within five minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      description: Clears text, sticker, mentions, and references; broadcasts chat_updated.
  /rooms/{room_id}/chat/{message_id}:
    delete:
      operationId: deleteRoomsRoomIdChatMessageId
      tags:
      - Community
      summary: Delete your own message or moderate as a manager
      parameters:
      - $ref: '#/components/parameters/RoomID'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Delete your own message or moderate as a manager
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
