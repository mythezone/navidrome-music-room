  /internal/v1/plugin-sync:
    servers:
      - url: https://music.example.test/music-room
    post:
      operationId: syncPlugin
      tags: [Updates]
      summary: Synchronize authorized Navidrome users and renew the bridge lease
      security: [{ pluginPairing: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSync' }
      responses:
        '200':
          description: Accepted heartbeat and cached update availability for the configured channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSyncResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    pluginPairing:
      type: http
      scheme: bearer
      description: Shared plugin pairing token configured in Navidrome and the gateway.
    roomSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-15-minute-room-session
  parameters:
    RoomID:
      name: room_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A caller-generated key retained in memory for 15 minutes. Repeating the same method,
        path, body, current authorized user, and key replays the original response and adds
        `Idempotency-Replayed: true`; reusing it for a different request returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Identifier:
      type: string
      pattern: '^[A-Za-z0-9_-]{16,128}$'
    AuthProof:
      type: object
      additionalProperties: false
      required: [username, salt, token]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        salt: { type: string, pattern: '^[A-Fa-f0-9]{8,64}$' }
        token: { type: string, pattern: '^[A-Fa-f0-9]{32}$' }
    Discovery:
      type: object
      additionalProperties: false
      required: [apiVersion, version, gatewayBaseURL, navidromeBaseURL, authenticationMode]
      properties:
        apiVersion: { type: string, const: v1 }
        version: { type: string }
        gatewayBaseURL: { type: string, format: uri }
        navidromeBaseURL: { type: string, format: uri }
        authenticationMode: { type: string, const: opensubsonic-proof-exchange }
    User:
      type: object
      required: [username, displayName, adminRole, musicFolderIDs]
      properties:
        username: { type: string }
        displayName: { type: string }
        adminRole: { type: boolean }
        musicFolderIDs:
          type: array
          items: { type: integer, minimum: 1 }
    AuthExchange:
      type: object
      required: [sessionToken, expiresAt, user, navidromeBaseURL, gatewayBaseURL, pluginLeaseExpiresAt]
      properties:
        sessionToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        navidromeBaseURL: { type: string, format: uri }
        gatewayBaseURL: { type: string, format: uri }
        pluginLeaseExpiresAt: { type: string, format: date-time }
    RoomCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        queueLimit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        playbackMode: { type: string, enum: [fifo, fair_random], default: fifo }
        musicFolderIDs:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        preloadNextTrack: { type: boolean, default: true }
        allowMemberSkip: { type: boolean, default: true }
    RoomPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        queueLimit: { type: integer, minimum: 1, maximum: 100 }
        playbackMode: { type: string, enum: [fifo, fair_random] }
        musicFolderIDs:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        preloadNextTrack: { type: boolean }
        allowMemberSkip: { type: boolean }
    Capabilities:
      type: object
      required: [chat, stickers, statistics, rankings, achievements, uploads, onlineSources, invites, queue, history]
      properties:
        chat: { type: boolean, const: true }
        stickers: { type: boolean, const: true }
        statistics: { type: boolean, const: true }
        rankings: { type: boolean, const: true }
        achievements: { type: boolean, const: true }
        uploads: { type: boolean, const: false }
        onlineSources: { type: boolean, const: false }
        invites: { type: boolean, const: true }
        queue: { type: boolean, const: true }
        history: { type: boolean, const: true }
    Room:
      type: object
      required: [roomID, name, ownerUsername, ownerDisplayName, status, queueLimit, playbackMode, musicFolderIDs, preloadNextTrack, allowMemberSkip, capabilities, onlineCount, createdAt, updatedAt]
      properties:
        roomID: { $ref: '#/components/schemas/Identifier' }
        name: { type: string }
        ownerUsername: { type: string }
        ownerDisplayName: { type: string }
        status: { type: string, enum: [open, closed] }
        queueLimit: { type: integer }
        playbackMode: { type: string, enum: [fifo, fair_random] }
        musicFolderIDs:
          type: array
          items: { type: integer }
        preloadNextTrack: { type: boolean }
        allowMemberSkip: { type: boolean }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        onlineCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Member:
      type: object
      required: [username, displayName, role, active, online, joinedAt, lastSeenAt]
      properties:
        roomID: { $ref: '#/components/schemas/Identifier' }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, member] }
        active: { type: boolean }
        online: { type: boolean }
        joinedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    Invite:
      type: object
      required: [inviteID, roomID, label, expiresAt, maxUses, useCount, createdBy, createdAt]
      properties:
        inviteID: { $ref: '#/components/schemas/Identifier' }
        roomID: { $ref: '#/components/schemas/Identifier' }
        label: { type: string }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }
        useCount: { type: integer }
        revokedAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    InviteWithSecret:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [invite, shareURL, deepLink]
          properties:
            invite: { type: string, readOnly: true }
            shareURL: { type: string, format: uri }
            deepLink: { type: string, format: uri }
    TrackRef:
      type: object
      required: [id, musicFolderID, title, artist, album, durationSeconds]
      properties:
        id: { type: string }
        musicFolderID: { type: integer, minimum: 1 }
        albumID: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        durationSeconds: { type: number, minimum: 0 }
        coverArtID: { type: string }
    QueueEntry:
      type: object
      required: [queueID, position, track, contributorUsername, contributorDisplayName, createdAt]
      properties:
        queueID: { $ref: '#/components/schemas/Identifier' }
        position: { type: integer, minimum: 1 }
        track: { $ref: '#/components/schemas/TrackRef' }
        contributorUsername: { type: string }
        contributorDisplayName: { type: string }
        createdAt: { type: string, format: date-time }
    QueueMutation:
      type: object
      required: [entry, queue]
      properties:
        entry: { $ref: '#/components/schemas/QueueEntry' }
        queue:
          type: array
          items: { $ref: '#/components/schemas/QueueEntry' }
        playback:
          description: Paused authoritative state emitted when an idle room is primed by this request.
          allOf:
            - { $ref: '#/components/schemas/Playback' }
    Playback:
      type: object
      required: [revision, serverTime, status, pausedForEmpty, positionSeconds]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        serverTime: { type: string, format: date-time }
        status: { type: string, enum: [stopped, playing, paused] }
        pausedForEmpty: { type: boolean }
        positionSeconds: { type: number, minimum: 0 }
        anchorServerTime: { type: string, format: date-time }
        currentTrack: { $ref: '#/components/schemas/TrackRef' }
        nextTrack: { $ref: '#/components/schemas/TrackRef' }
        contributorUsername: { type: string }
        contributorDisplayName: { type: string }
    Snapshot:
      type: object
      required: [room, self, members, queue, playback, history, permissions, generatedAt]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        self: { $ref: '#/components/schemas/Member' }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        queue:
          type: array
          items: { $ref: '#/components/schemas/QueueEntry' }
        playback: { $ref: '#/components/schemas/Playback' }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        permissions: { $ref: '#/components/schemas/RoomPermissions' }
        updateNotice: { $ref: '#/components/schemas/UpdateNotice' }
        generatedAt: { type: string, format: date-time }
    FeatureAvailability:
      type: object
      additionalProperties: false
      required: [project, features]
      properties:
        project:
          type: object
          additionalProperties: false
          required: [openSource, spdxLicense]
          properties:
            openSource: { type: boolean, const: true }
            spdxLicense: { type: string, const: GPL-3.0-only }
        features:
          type: object
          additionalProperties: false
          required: [rooms, invites, presence, synchronizedPlayback, queue, history, chat, stickers, statistics, rankings, achievements, uploads, onlineSources]
          properties:
            rooms: { type: boolean }
            invites: { type: boolean }
            presence: { type: boolean }
            synchronizedPlayback: { type: boolean }
            queue: { type: boolean }
            history: { type: boolean }
            chat: { type: boolean }
            stickers: { type: boolean }
            statistics: { type: boolean }
            rankings: { type: boolean }
            achievements: { type: boolean }
            uploads: { type: boolean }
            onlineSources: { type: boolean }
    DiagnosticBundle:
      type: object
      additionalProperties: false
      required: [format, generatedAt, redacted, gateway, configuration, plugin, database, update]
      properties:
        format: { type: string, const: navidrome-music-room-diagnostics/v1 }
        generatedAt: { type: string, format: date-time }
        redacted: { type: boolean, const: true }
        gateway: { type: object, additionalProperties: true }
        configuration: { type: object, additionalProperties: true }
        plugin: { type: object, additionalProperties: true }
        database:
          type: object
          additionalProperties: false
          required: [quickCheck, schemaVersion, pageCount, pageSize, tableCounts]
          properties:
            quickCheck: { type: string }
            schemaVersion: { type: integer, minimum: 0 }
            pageCount: { type: integer, minimum: 0 }
            pageSize: { type: integer, minimum: 0 }
            tableCounts:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
        update: { type: object, additionalProperties: true }
    UpdateStatus:
      type: object
      required: [currentVersion, channel, updateAvailable, rollbackAvailable, state, prerelease]
      properties:
        currentVersion: { type: string }
        channel: { type: string, enum: [stable, beta] }
        latestVersion: { type: string }
        updateAvailable: { type: boolean }
        releaseURL: { type: string, format: uri }
        checkedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        prerelease: { type: boolean }
        releaseNotes: { type: string, maxLength: 4000 }
        stagedVersion: { type: string }
        rollbackVersion: { type: string }
        rollbackAvailable: { type: boolean }
        state: { type: string }
        lastError: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    RoomPermissions:
      type: object
      required:
      - canManage
      - canControl
      - canSkip
      - canReorderQueue
      - canFulfillWish
      properties:
        canManage:
          type: boolean
        canControl:
          type: boolean
        canSkip:
          type: boolean
        canReorderQueue:
          type: boolean
        canFulfillWish:
          type: boolean
    UpdateNotice:
      type: object
      required:
      - currentVersion
      - latestVersion
      - channel
      properties:
        currentVersion:
          type: string
        latestVersion:
          type: string
        channel:
          type: string
          enum:
          - stable
          - beta
        releaseURL:
          type: string
          format: uri
    HistoryEntry:
      type: object
      required:
      - historyID
      - track
      - contributorUsername
      - contributorDisplayName
      - startedAt
      - playedSeconds
      properties:
        historyID:
          $ref: '#/components/schemas/Identifier'
        roomID:
          $ref: '#/components/schemas/Identifier'
        track:
          $ref: '#/components/schemas/TrackRef'
        contributorUsername:
          type: string
        contributorDisplayName:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        playedSeconds:
          type: number
          minimum: 0
    QueueList:
      type: object
      required:
      - queue
      properties:
        queue:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntry'
    ChatReference:
      type: object
      required:
      - kind
      - id
      - title
      properties:
        kind:
          type: string
          enum:
          - track
          - album
          - artist
        id:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 300
        artist:
          type: string
          maxLength: 300
      additionalProperties: false
    ChatCreate:
      type: object
      required: []
      properties:
        messageType:
          type: string
          enum:
          - chat
          - review
