    MemberStats:
      type: object
      required:
      - staySeconds
      - requestedCount
      - listenedCount
      - chatCount
      properties:
        staySeconds:
          type: number
          minimum: 0
        requestedCount:
          type: integer
          minimum: 0
        listenedCount:
          type: integer
          minimum: 0
        chatCount:
          type: integer
          minimum: 0
    MemberLevel:
      type: object
      required:
      - level
      - code
      - effectiveMinutes
      - currentThresholdMinutes
      - nextThresholdMinutes
      - progress
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 10
        code:
          type: string
          pattern: ^level_([1-9]|10)$
        effectiveMinutes:
          type: number
          minimum: 0
        currentThresholdMinutes:
          type: number
          minimum: 0
        nextThresholdMinutes:
          type: number
          minimum: 0
        progress:
          type: number
          minimum: 0
          maximum: 1
      description: 'Effective minutes = staySeconds/60 + listenedCount*5 + requestedCount*3 + chatCount. Thresholds:
        0, 60, 180, 420, 900, 1800, 3600, 7200, 14400, 28800. At level 10, both thresholds are 28800 and progress is
        1.'
