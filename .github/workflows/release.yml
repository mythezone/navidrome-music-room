name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: plugin/go.sum
      - name: Install verified TinyGo
        run: |
          curl --http1.1 -fsSL --retry 5 --retry-all-errors -o /tmp/tinygo.tar.gz https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo0.41.1.linux-amd64.tar.gz
          echo 'e156d1d93a376eef639a4143d13be07e8c463fb6cf2d7d447698ed4474d23e91  /tmp/tinygo.tar.gz' | sha256sum -c -
          sudo mkdir -p /opt/tinygo
          sudo tar -xzf /tmp/tinygo.tar.gz -C /opt/tinygo --strip-components=1
          echo /opt/tinygo/bin >> "$GITHUB_PATH"
      - run: ./script/build-plugin.sh "${GITHUB_REF_NAME}"
      - run: docker run --rm -v "$PWD/dist:/dist:ro" deluan/navidrome:0.63.2 plugin validate /dist/navidrome-music-room.ndp
      - run: docker run --rm -v "$PWD/dist:/dist:ro" deluan/navidrome:latest plugin validate /dist/navidrome-music-room.ndp
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/navidrome-music-room.ndp

  bundles:
    needs: plugin
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: gateway/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: dist
      - run: ./script/package-release.sh "${{ matrix.arch }}" "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/navidrome-music-room-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: release
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2
      - uses: anchore/sbom-action/download-syft@v0.20.6
      - name: Checksums, SBOMs, and keyless Sigstore bundles
        working-directory: release
        run: |
          sha256sum navidrome-music-room-linux-*.tar.gz navidrome-music-room.ndp > checksums.txt
          for asset in navidrome-music-room-linux-*.tar.gz navidrome-music-room.ndp; do
            syft "$asset" -o spdx-json="${asset}.spdx.json"
            digest=$(sha256sum "$asset" | cut -d' ' -f1)
            jq -n \
              --arg asset "$asset" \
              --arg digest "$digest" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg ref "$GITHUB_REF" \
              --arg runID "$GITHUB_RUN_ID" \
              '{
                "_type":"https://in-toto.io/Statement/v1",
                subject:[{name:$asset,digest:{sha256:$digest}}],
                predicateType:"https://slsa.dev/provenance/v1",
                predicate:{
                  buildDefinition:{
                    buildType:"https://github.com/Attestations/GitHubActionsWorkflow@v1",
                    externalParameters:{workflow:{repository:$repository,ref:$ref,path:".github/workflows/release.yml"}}
                  },
                  runDetails:{builder:{id:"https://github.com/actions/runner"},metadata:{invocationID:$runID}}
                }
              }' > "${asset}.provenance.json"
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
            cosign sign-blob --yes --bundle "${asset}.spdx.json.sigstore.json" "${asset}.spdx.json"
            cosign sign-blob --yes --bundle "${asset}.provenance.json.sigstore.json" "${asset}.provenance.json"
          done
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release/*"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*

  container:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
