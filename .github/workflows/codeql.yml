name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - working-directory: gateway
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
