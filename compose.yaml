name: navidrome-music-room

services:
  edge:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_healthy
      music-room-gateway:
        condition: service_healthy
    ports:
      - "${NAVIDROME_BIND_ADDRESS:-127.0.0.1}:${NAVIDROME_PORT:-4533}:4533"
    volumes:
      - ./deploy/edge-nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4533/ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  navidrome:
    image: ${NAVIDROME_IMAGE:-deluan/navidrome:latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    expose:
      - "4533"
    environment:
      ND_LOGLEVEL: info
      ND_BASEURL: ""
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_FOLDER: /plugins
      ND_PLUGINS_AUTORELOAD: "true"
      TZ: ${TZ:-UTC}
    volumes:
      - ${NAVIDROME_DATA_PATH:-./data/navidrome}:/data
      - ${NAVIDROME_PLUGINS_PATH:-./data/plugins}:/plugins
      - ${MUSIC_LIBRARY_PATH:-./music}:/music:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4533/ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  music-room-gateway:
    image: ${MUSIC_ROOM_IMAGE:-ghcr.io/mythezone/navidrome-music-room:latest}
    build:
      context: .
      args:
        VERSION: ${MUSIC_ROOM_VERSION:-1.1.0-dev}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_healthy
    expose:
      - "4534"
    environment:
      MUSIC_ROOM_LISTEN_ADDRESS: :4534
      MUSIC_ROOM_DATA_DIR: /plugins/navidrome-music-room/room-data
      MUSIC_ROOM_NAVIDROME_INTERNAL_URL: http://navidrome:4533
      MUSIC_ROOM_NAVIDROME_PUBLIC_URL: ${NAVIDROME_PUBLIC_URL:?set NAVIDROME_PUBLIC_URL}
      MUSIC_ROOM_PUBLIC_URL: ${MUSIC_ROOM_PUBLIC_URL:?set MUSIC_ROOM_PUBLIC_URL}
      MUSIC_ROOM_PLUGIN_PAIRING_TOKEN: ${MUSIC_ROOM_PLUGIN_PAIRING_TOKEN:?set MUSIC_ROOM_PLUGIN_PAIRING_TOKEN}
      MUSIC_ROOM_PLUGIN_INSTALL_DIR: /plugins
      MUSIC_ROOM_BOOTSTRAP_RELEASE_DIR: /opt/music-room/release
      MUSIC_ROOM_RELEASE_REPOSITORY: mythezone/navidrome-music-room
      MUSIC_ROOM_ALLOWED_ORIGINS: ${MUSIC_ROOM_ALLOWED_ORIGINS:-}
      MUSIC_ROOM_TRUST_PROXY: "true"
      MUSIC_ROOM_VERSION: ${MUSIC_ROOM_VERSION:-1.1.0-dev}
      TZ: ${TZ:-UTC}
    volumes:
      - ${NAVIDROME_PLUGINS_PATH:-./data/plugins}:/plugins
    healthcheck:
      test: ["CMD", "/opt/music-room/release/music-room-gateway", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
