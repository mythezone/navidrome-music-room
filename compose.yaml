name: navidrome-music-room

services:
  navidrome:
    image: deluan/navidrome:0.63.2
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:4533:4533"
    environment:
      ND_LOGLEVEL: info
      ND_BASEURL: ""
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_FOLDER: /plugins
      ND_PLUGINS_AUTORELOAD: "false"
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/navidrome:/data
      - ./data/plugins:/plugins
      - ${MUSIC_LIBRARY_PATH:-./music}:/music:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4533/ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  music-room-gateway:
    image: ${MUSIC_ROOM_IMAGE:-ghcr.io/mythezone/navidrome-music-room:beta}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_healthy
    ports:
      - "127.0.0.1:4534:4534"
    environment:
      MUSIC_ROOM_LISTEN_ADDRESS: :4534
      MUSIC_ROOM_DATA_DIR: /plugins/navidrome-music-room/room-data
      MUSIC_ROOM_NAVIDROME_INTERNAL_URL: http://navidrome:4533
      MUSIC_ROOM_NAVIDROME_PUBLIC_URL: ${NAVIDROME_PUBLIC_URL:?set NAVIDROME_PUBLIC_URL}
      MUSIC_ROOM_PUBLIC_URL: ${MUSIC_ROOM_PUBLIC_URL:?set MUSIC_ROOM_PUBLIC_URL}
      MUSIC_ROOM_PLUGIN_PAIRING_TOKEN: ${MUSIC_ROOM_PLUGIN_PAIRING_TOKEN:?set MUSIC_ROOM_PLUGIN_PAIRING_TOKEN}
      MUSIC_ROOM_PLUGIN_INSTALL_DIR: /plugins
      MUSIC_ROOM_BOOTSTRAP_RELEASE_DIR: /opt/music-room/release
      MUSIC_ROOM_RELEASE_REPOSITORY: mythezone/navidrome-music-room
      MUSIC_ROOM_ALLOWED_ORIGINS: ${MUSIC_ROOM_ALLOWED_ORIGINS:-}
      MUSIC_ROOM_TRUST_PROXY: "true"
      MUSIC_ROOM_VERSION: ${MUSIC_ROOM_VERSION:-0.1.0-dev}
      MUSIC_ROOM_LICENSE_PUBLIC_KEY: ${MUSIC_ROOM_LICENSE_PUBLIC_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/plugins:/plugins
    healthcheck:
      test: ["CMD", "/opt/music-room/release/music-room-gateway", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
